<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>知乎时间轴 · 记录 — CRAZY LAB</title>
<style>
  :root{
    --bg:#f6f8fa;
    --surface:#ffffff;
    --surface-2:#f6f8fa;
    --ink:#1f2328;
    --ink-2:#656d76;
    --ink-3:#8c959f;
    --line:#d0d7de;
    --line-2:#eaeef2;
    --accent:#0969da;
    --accent-2:#0550ae;
    --danger:#cf222e;
    --success:#1a7f37;
    --radius:12px;
    --radius-sm:6px;
    --shadow:0 1px 2px rgba(31,35,40,.04),0 1px 3px rgba(31,35,40,.08);
    --shadow-lg:0 8px 24px rgba(31,35,40,.08);
    --cell-0:#ebedf0;
    --cell-1:#dbeafe;
    --cell-2:#93c5fd;
    --cell-3:#3b82f6;
    --cell-4:#1d4ed8;
  }
  [data-theme="dark"]{
    --bg:#0d1117;
    --surface:#161b22;
    --surface-2:#0d1117;
    --ink:#c9d1d9;
    --ink-2:#8b949e;
    --ink-3:#6e7681;
    --line:#30363d;
    --line-2:#21262d;
    --accent:#58a6ff;
    --accent-2:#79c0ff;
    --danger:#f85149;
    --success:#3fb950;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    --shadow-lg:0 8px 24px rgba(0,0,0,.35);
    --cell-0:#161b22;
    --cell-1:#172554;
    --cell-2:#1e3a8a;
    --cell-3:#2563eb;
    --cell-4:#60a5fa;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.55;transition:background .2s ease,color .2s ease}
  .wrap{max-width:1000px;margin:0 auto;padding:32px 18px 80px}
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
  header h1{font-size:28px;margin:0 0 6px;letter-spacing:-.5px;font-weight:800}
  header p{margin:0;color:var(--ink-2);font-size:14px}
  .theme-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer;font-size:13px;font-weight:600;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;transition:transform .1s ease,border-color .2s}
  .theme-btn:hover{border-color:var(--ink-3)}
  .theme-btn:active{transform:scale(.98)}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 18px;box-shadow:var(--shadow);transition:background .2s,border-color .2s}
  .card .label{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin-bottom:6px}
  .card .value{font-size:32px;font-weight:800;line-height:1;color:var(--ink)}
  .card .value small{font-size:14px;color:var(--ink-2);font-weight:600;margin-left:4px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:18px;transition:background .2s,border-color .2s}
  .panel h2{font-size:16px;margin:0 0 16px;color:var(--ink);font-weight:700}
  .form{display:grid;grid-template-columns:1fr 140px auto;gap:12px;align-items:end}
  @media (max-width:680px){.form{grid-template-columns:1fr}}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;font-weight:600;color:var(--ink-2)}
  .field input,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2);color:var(--ink);font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s}
  .field input:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(9,105,218,.12)}
  [data-theme="dark"] .field input:focus,[data-theme="dark"] .field textarea:focus{box-shadow:0 0 0 3px rgba(88,166,255,.2)}
  .field textarea{min-height:80px;resize:vertical}
  .btn{border:0;border-radius:var(--radius-sm);padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .1s,filter .2s}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{filter:brightness(1.05)}
  .btn-ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
  .btn-ghost:hover{background:var(--line-2)}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid transparent}
  .btn-danger:hover{border-color:var(--line)}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .heatmap-wrap{overflow-x:auto;padding-bottom:8px}
  .heatmap{display:inline-flex;gap:3px;min-width:100%}
  .week-col{display:flex;flex-direction:column;gap:3px}
  .day{width:11px;height:11px;border-radius:2px;background:var(--cell-0);position:relative;cursor:pointer;transition:transform .1s}
  .day:hover{transform:scale(1.25);z-index:1;outline:2px solid var(--accent);outline-offset:1px}
  .day[data-l="1"]{background:var(--cell-1)}
  .day[data-l="2"]{background:var(--cell-2)}
  .day[data-l="3"]{background:var(--cell-3)}
  .day[data-l="4"]{background:var(--cell-4)}
  .heatmap-axis{display:flex;gap:3px}
  .month-row{display:flex;font-size:11px;color:var(--ink-3);margin-bottom:6px;height:14px;padding-left:30px}
  .month-row span{flex:1;text-align:left;min-width:11px;white-space:nowrap}
  .week-labels{display:flex;flex-direction:column;gap:3px;margin-right:6px;padding-top:22px}
  .week-labels span{height:11px;font-size:10px;line-height:11px;color:var(--ink-3);text-align:right}
  .legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);margin-top:14px}
  .legend .swatch{width:11px;height:11px;border-radius:2px;background:var(--cell-0)}
  .tooltip{position:fixed;pointer-events:none;z-index:1000;background:var(--ink);color:#fff;font-size:12px;padding:8px 10px;border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);white-space:nowrap;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
  .tooltip.show{opacity:1;transform:translateY(0)}
  .tooltip::after{content:'';position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);border-width:5px 5px 0;border-style:solid;border-color:var(--ink) transparent transparent}
  .list{margin-top:10px}
  .list-item{display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-bottom:1px solid var(--line-2);transition:background .2s}
  .list-item:last-child{border-bottom:0}
  .list-item:hover{background:var(--surface-2);margin:0 -16px;padding-left:16px;padding-right:16px;border-radius:var(--radius-sm)}
  .list-date{flex:0 0 70px;text-align:center}
  .list-date .d{font-size:22px;font-weight:800;line-height:1;color:var(--ink)}
  .list-date .m{font-size:11px;color:var(--ink-3);text-transform:uppercase;margin-top:2px}
  .list-body{flex:1;min-width:0}
  .list-body a{color:var(--accent);text-decoration:none;font-size:14px;font-weight:600;word-break:break-all}
  .list-body a:hover{text-decoration:underline}
  .list-body .note{color:var(--ink-2);font-size:13px;margin-top:4px;line-height:1.5}
  .list-meta{font-size:11px;color:var(--ink-3);margin-top:6px}
  .list-actions{display:flex;gap:6px;opacity:0;transition:opacity .2s}
  .list-item:hover .list-actions{opacity:1}
  @media (max-width:680px){.list-actions{opacity:1}}
  .empty{text-align:center;padding:50px 20px;color:var(--ink-3)}
  .empty svg{width:64px;height:64px;margin-bottom:16px;opacity:.35}
  .empty h3{margin:0 0 6px;font-size:16px;color:var(--ink-2)}
  .empty p{margin:0;font-size:13px}
  .hidden{display:none!important}
  footer{margin-top:40px;text-align:center;color:var(--ink-3);font-size:12px}
  footer a{color:var(--ink-3)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>知乎时间轴 · 记录</h1>
      <p>记录你在知乎冲浪的每一天。点点连成线，就是你的编年史。</p>
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="切换主题">深色</button>
  </header>

  <div class="cards">
    <div class="card">
      <div class="label">总记录数</div>
      <div class="value" id="totalCount">0</div>
    </div>
    <div class="card">
      <div class="label">连续记录</div>
      <div class="value" id="streakCount">0<small>天</small></div>
    </div>
    <div class="card">
      <div class="label">今年记录</div>
      <div class="value" id="yearCount">0<small>条</small></div>
    </div>
  </div>

  <div class="panel">
    <h2>添加一条记录</h2>
    <div class="form">
      <div class="field" style="grid-column:1 / -1">
        <label for="url">知乎链接</label>
        <input type="url" id="url" placeholder="https://www.zhihu.com/question/... 或 https://zhuanlan.zhihu.com/p/..." />
      </div>
      <div class="field">
        <label for="date">日期</label>
        <input type="date" id="date" />
      </div>
      <div class="field">
        <label for="tag">标签</label>
        <input type="text" id="tag" placeholder="可选，如：观点 / 教程 / 八卦" />
      </div>
      <button class="btn btn-primary" id="addBtn">添加</button>
      <div class="field" style="grid-column:1 / -1">
        <label for="note">备注</label>
        <textarea id="note" placeholder="一句话总结为什么值得记录，方便以后回看"></textarea>
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-ghost" id="demoBtn">填几个示例看看效果</button>
      <button class="btn btn-ghost" id="exportBtn">导出 JSON</button>
      <button class="btn btn-ghost" id="importBtn">导入 JSON</button>
      <input type="file" id="importFile" accept="application/json" class="hidden" />
    </div>
  </div>

  <div class="panel">
    <h2>热力图</h2>
    <div class="heatmap-wrap">
      <div class="month-row" id="monthRow"></div>
      <div class="heatmap-axis">
        <div class="week-labels">
          <span>一</span><span></span><span>三</span><span></span><span>五</span><span></span><span>日</span>
        </div>
        <div class="heatmap" id="heatmap"></div>
      </div>
    </div>
    <div class="legend">
      <span>少</span>
      <span class="swatch" style="background:var(--cell-0)"></span>
      <span class="swatch" style="background:var(--cell-1)"></span>
      <span class="swatch" style="background:var(--cell-2)"></span>
      <span class="swatch" style="background:var(--cell-3)"></span>
      <span class="swatch" style="background:var(--cell-4)"></span>
      <span>多</span>
    </div>
  </div>

  <div class="panel">
    <h2>时间轴</h2>
    <div id="list" class="list"></div>
  </div>

  <footer>
    CRAZY LAB · 数据仅保存在你的浏览器本地（localStorage），<a href="https://thecrazylab.github.io/crazy-lab/">返回实验室</a>
  </footer>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
const LS_KEY='zhihu_records_v2';
let records=load();
const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);
const pad=n=>String(n).padStart(2,'0');

function load(){try{const s=localStorage.getItem(LS_KEY);return s?JSON.parse(s):[]}catch(e){return []}}
function save(){localStorage.setItem(LS_KEY,JSON.stringify(records));render()}

function parseDate(d){const [y,m,day]=d.split('-').map(Number);return new Date(y,m-1,day)}
function fmtDate(d){const date=parseDate(d);return `${d} · 星期'日一二三四五六'[date.getDay()]`}

function level(n){if(n===0)return 0;if(n<=2)return 1;if(n<=4)return 2;if(n<=6)return 3;return 4}

function render(){
  records.sort((a,b)=>b.date.localeCompare(a.date)||b.created.localeCompare(a.created));
  $('date').value=today();
  renderStats();
  renderHeatmap();
  renderList();
}

function renderStats(){
  $('totalCount').textContent=records.length;
  const ys=records.filter(r=>r.date.startsWith(new Date().getFullYear()));
  $('yearCount').innerHTML=ys.length+'<small>条</small>';
  $('streakCount').innerHTML=calcStreak(records)+'<small>天</small>';
}

function calcStreak(records){
  if(!records.length)return 0;
  const set=new Set(records.map(r=>r.date));
  let streak=0;let d=new Date();
  const key=dt=>`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
  while(set.has(key(d))){streak++;d.setDate(d.getDate()-1)}
  return streak;
}

function renderHeatmap(){
  const end=new Date();const start=new Date();start.setFullYear(end.getFullYear()-1);start.setDate(start.getDate()+1);
  const map={};records.forEach(r=>{map[r.date]=(map[r.date]||0)+1});
  const weeks=[];let curWeek=[];const monthRow=$('monthRow');monthRow.innerHTML='';
  const months=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  let firstDay=start.getDay()||7; // 1=Mon
  for(let i=1;i<firstDay;i++)curWeek.push(null);
  const d=new Date(start);
  while(d<=end){curWeek.push(new Date(d));d.setDate(d.getDate()+1);if(curWeek.length===7){weeks.push(curWeek);curWeek=[]}}
  if(curWeek.length)weeks.push(curWeek.concat(new Array(7-curWeek.length).fill(null)));

  // month labels
  let lastMonth=-1;let labelCount=0;
  for(let wi=0;wi<weeks.length;wi++){
    const day0=weeks[wi][0];const day3=weeks[wi][3];
    const ref=day0||day3;const span=document.createElement('span');span.style.flex='1';span.style.minWidth='11px';
    if(ref&&ref.getMonth()!==lastMonth){span.textContent=months[ref.getMonth()];lastMonth=ref.getMonth()}
    monthRow.appendChild(span);
  }

  const heatmap=$('heatmap');heatmap.innerHTML='';
  weeks.forEach((week,wi)=>{
    const col=document.createElement('div');col.className='week-col';
    week.forEach(day=>{
      const cell=document.createElement('div');cell.className='day';
      if(day){
        const key=`${day.getFullYear()}-${pad(day.getMonth()+1)}-${pad(day.getDate())}`;
        const n=map[key]||0;cell.dataset.l=level(n);
        cell.dataset.date=key;cell.dataset.count=n;
        cell.addEventListener('mouseenter',showTip);cell.addEventListener('mouseleave',hideTip);
      }else{
        cell.style.background='transparent';cell.style.pointerEvents='none';
      }
      col.appendChild(cell);
    });
    heatmap.appendChild(col);
  });
}

const tooltip=$('tooltip');
function showTip(e){
  const c=e.target.dataset.count|0;const d=e.target.dataset.date;
  tooltip.innerHTML=`<strong>${c?c+' 条记录':'无记录'}</strong><br/><span style="opacity:.8">${d}</span>`;
  const rect=e.target.getBoundingClientRect();
  const left=rect.left+rect.width/2;const top=rect.top-8;
  tooltip.style.left=left+'px';tooltip.style.top=top+'px';tooltip.style.transform='translate(-50%, -100%)';
  tooltip.classList.add('show');
}
function hideTip(){tooltip.classList.remove('show')}

function renderList(){
  const list=$('list');list.innerHTML='';
  if(!records.length){
    list.innerHTML=`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg><h3>还没有记录</h3><p>从上方添加第一条知乎链接，或者点「填几个示例看看效果」。</p></div>`;
    return;
  }
  records.forEach((r,idx)=>{
    const date=parseDate(r.date);
    const item=document.createElement('div');item.className='list-item';
    const title=r.url?(r.url.replace(/^https?:\/\//,'').split('/')[0]||'知乎链接'):'知乎记录';
    item.innerHTML=`<div class="list-date"><div class="d">${pad(date.getDate())}</div><div class="m">${date.getMonth()+1}月</div></div>
    <div class="list-body">
      <a href="${escapeHtml(r.url||'#')}" target="_blank" rel="noopener">${escapeHtml(title)}</a>
      ${r.note?`<div class="note">${escapeHtml(r.note)}</div>`:''}
      <div class="list-meta">${r.date}${r.tag?` · ${escapeHtml(r.tag)}`:''}</div>
    </div>
    <div class="list-actions"><button class="btn btn-danger" data-idx="${idx}">删除</button></div>`;
    list.appendChild(item);
  });
  list.querySelectorAll('button[data-idx]').forEach(btn=>btn.addEventListener('click',e=>{
    const i=+e.target.dataset.idx;if(confirm('删除这条记录？')){records.splice(i,1);save();}
  }));
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

$('addBtn').addEventListener('click',()=>{
  const url=$('url').value.trim();const date=$('date').value;const note=$('note').value.trim();const tag=$('tag').value.trim();
  if(!url){alert('请填写知乎链接');return}
  if(!date){alert('请选择日期');return}
  records.push({url,date,note,tag,created:new Date().toISOString()});
  $('url').value='';$('note').value='';$('tag').value='';$('date').value=today();
  save();
});

$('demoBtn').addEventListener('click',()=>{
  const demos=[
    {url:'https://www.zhihu.com/question/1234567890/answer/987654321',date:offsetDays(-1),note:'关于某个产品的深度回答',tag:'产品'},
    {url:'https://zhuanlan.zhihu.com/p/555555555',date:offsetDays(-2),note:'一篇讲认知偏误的好文',tag:'认知'},
    {url:'https://www.zhihu.com/question/999999999',date:offsetDays(-4),note:'生活小技巧合集',tag:'生活'},
    {url:'https://www.zhihu.com/question/1111111111/answer/222222222',date:offsetDays(-7),note:'观点犀利，值得收藏',tag:'观点'},
    {url:'https://zhuanlan.zhihu.com/p/777777777',date:offsetDays(-8),note:'学习方法的总结',tag:'学习'},
  ];
  demos.forEach(d=>records.push({...d,created:new Date().toISOString()}));
  save();
});

function offsetDays(n){const d=new Date();d.setDate(d.getDate()+n);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}

$('exportBtn').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify(records,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`zhihu-records-${today()}.json`;a.click();
});

$('importBtn').addEventListener('click',()=>$('importFile').click());
$('importFile').addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{try{const data=JSON.parse(ev.target.result);if(!Array.isArray(data))throw new Error('格式错误');records=data;save();alert(`导入了 ${data.length} 条记录`)}catch(err){alert('导入失败：'+err.message)}$('importFile').value=''};
  reader.readAsText(file);
});

const themeBtn=$('themeBtn');
function applyTheme(dark){
  document.documentElement.dataset.theme=dark?'dark':'light';
  themeBtn.textContent=dark?'浅色':'深色';
  localStorage.setItem('zhihu_records_theme',dark?'dark':'light');
}
themeBtn.addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme!=='dark'));
const savedTheme=localStorage.getItem('zhihu_records_theme');
if(savedTheme)applyTheme(savedTheme==='dark');else applyTheme(window.matchMedia('(prefers-color-scheme: dark)').matches);

render();
</script>
</body>
</html>
